# The tunnel every guest destination goes through.
#
#   vmgate -config examples/vmgate.toml
#
# This is the file `wg-quick up` would take, in wg-quick syntax, and vmgate
# reads it itself: no wg, no wg-quick, no kernel interface, no root. wireguard-go
# runs inside the process and its "interface" is one of the gVisor netstack's
# NICs, so the guest's packets are encrypted and sent by this user process alone.
#
# Generate a key pair with:
#
#   wg genkey | tee privatekey | wg pubkey > publickey
#
# The keys below are placeholders. The gateway will start with them, the tunnel
# will simply never complete a handshake, and the log says so.
#
# What this file means here, which is not exactly what it means to wg-quick:
#
#   * Exactly one [Peer]. One VM's traffic through one VPN. More is a startup
#     error, not a surprise.
#   * AllowedIPs is the gate, not a routing hint: a destination the peer will
#     not carry has no route at all and is refused. It is never sent out some
#     other way, which is the whole point.
#   * Address must not be inside the guest's network (10.0.2.0/24 by default):
#     the gateway answers ARP for the guest subnet, and an address that belongs
#     to both sides is a loop waiting to happen. The gateway refuses to start.
#   * DNS entries have to be addresses; they are asked through the tunnel and
#     become what the guest's lookups use. See the note in vmgate.toml.
#   * IPv6 is read and ignored. MTU left out means 1420, and a gateway link
#     bigger than the tunnel's is lowered to it so guests do not fragment.
#   * wg-quick's kernel instructions (Table, Fwmark, PreUp, PostUp, PreDown,
#     PostDown, SaveConfig, SaveDNS) are accepted and have no effect: there is
#     no kernel side here. Any other unknown key is a startup error.

[Interface]
# The tunnel's own key. Never logged, never printed: the status line shows the
# peer's public key in short form and nothing of this.
PrivateKey = VAeDHMfV2LaLEcbGmtJT2m1vKREPxVjbHviEkBhFQc0=

# The address the tunnel presents to the other end. /32 is what a VPN gateway
# expects; the address has to be outside the guest's network.
Address = 10.76.0.2/32

# Asked from inside the tunnel, so a lookup leaves the same way the guest's
# traffic does. Addresses only: the gateway has no resolver to ask before the
# tunnel exists.
DNS = 10.76.0.1

# Where the tunnel receives. Left out, the host picks one and the startup log
# says which. Only matters when the peer dials in rather than being dialled.
# ListenPort = 51820

# Left out, 1420, which is what wg-quick uses. Between 1280 and 1500: a larger
# number does not carry more, it only sets a bigger ceiling on what a peer can
# make this process hold in memory.
# MTU = 1420

[Peer]
PublicKey = pI2Kvg8DGWnUyFILsv20UV2tZgkCKUAfxHiT0w1CZsE=

# The VPN gateway. A name is allowed and is resolved once, by the host, at
# startup, so a name that does not resolve stops the gateway there rather than
# in the middle of a connection: reaching the peer is what the tunnel is for,
# so it cannot be reached through it. The address below is TEST-NET-3, which
# nothing answers, so the sample starts and simply never handshakes.
Endpoint = 203.0.113.9:51820

# Everything. A narrower list is a network the peer serves, and everything
# outside it is refused rather than leaked out another way. Keep the guest's
# own subnet out of here: the gateway has to be able to answer for it.
AllowedIPs = 0.0.0.0/0

# Optional, and mixed into the handshake when present.
# PresharedKey =

# Hold the path open through a NAT that forgets flows quickly. Useful when the
# peer has no Endpoint of its own and must dial in.
PersistentKeepalive = 25
